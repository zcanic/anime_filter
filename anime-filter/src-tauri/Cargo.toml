[package]
name = "anime-filter"
version = "0.2.0"
description = "AI-powered anime selection app"
authors = ["zcan"]
edition = "2021"

[lib]
name = "anime_filter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Python backend communication
reqwest = { version = "0.12", features = ["json"] }

# Unix signal handling for process cleanup
libc = "0.2"

# REMOVED (now handled by Python):
# - csv (CSV parsing)
# - rusqlite (database)
# - anyhow (error handling - using String for simplicity)
# - chrono (timestamps - Python handles this)
